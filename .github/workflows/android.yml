name: Build Android APK

# Builds the psst WebView app into an installable APK. The GitHub-hosted
# ubuntu runner already has the Android SDK, so no SDK download is needed.
#
# Set the deployed web app URL in one of two ways:
#   - a repository variable APP_URL (Settings -> Secrets and variables -> Actions -> Variables), or
#   - the app_url input when running the workflow manually.
# The built APK is uploaded as a workflow artifact (and attached to a release
# when the run was triggered by pushing a tag like v1.0).

on:
  workflow_dispatch:
    inputs:
      app_url:
        description: "Deployed web app URL (e.g. https://your-app.vercel.app)"
        required: false
        default: ""
  push:
    tags:
      - "v*"

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: AnonStory/mobile
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Resolve app URL
        id: url
        run: |
          URL="${{ github.event.inputs.app_url }}"
          if [ -z "$URL" ]; then URL="${{ vars.APP_URL }}"; fi
          if [ -z "$URL" ]; then URL="https://example.vercel.app"; fi
          echo "value=$URL" >> "$GITHUB_OUTPUT"
          echo "Building with app URL: $URL"

      - name: Build debug APK
        run: ./gradlew --no-daemon assembleDebug -PappUrl="${{ steps.url.outputs.value }}"

      - name: Rename APK
        run: |
          mkdir -p ../../dist
          cp app/build/outputs/apk/debug/app-debug.apk ../../dist/psst.apk

      - uses: actions/upload-artifact@v4
        with:
          name: psst-apk
          path: dist/psst.apk

      - name: Attach to release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: dist/psst.apk
